name: Validate integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fixtures: ["0.13.367", "0.13.368"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: pip install pytest-homeassistant-custom-component==${{ matrix.fixtures }}
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov-fail-under=90
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:panel
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, hassfest, panel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build and validate release assets
        run: python scripts/build-release.py --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Thermo Control $GITHUB_REF_NAME" \
            --notes-file "releases/$GITHUB_REF_NAME.md" \
            --latest \
            dist/thermo-control-*.zip dist/SHA256SUMS
